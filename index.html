<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width, initial-scale=1"><title>Hospital Dashboard</title><script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script><style>body{font-family:Arial;background:#f0f4f8;padding:15px}.card{background:white;padding:15px;margin:10px 0;border-radius:12px;box-shadow:0 2px 8px #ccc}.val{font-weight:bold;color:#c62828}</style></head><body><h2>🏥 Smart Hospital IoT - Live</h2><div class="card">Status: <span id="status">Connecting...</span></div><div class="card"><h3>Doctor Panel</h3><div class="val" id="vitals">Waiting... Run Wokwi</div></div><div class="card"><h3>Facility Panel</h3><div class="val" id="env">Waiting...</div></div><script>const c=mqtt.connect('wss://broker.hivemq.com:8884/mqtt');c.on('connect',()=>{document.getElementById('status').innerText='CONNECTED LIVE';c.subscribe('hospital/patient/vitals');c.subscribe('hospital/room/env');});c.on('message',(t,m)=>{if(t.includes('vitals'))document.getElementById('vitals').innerText=m;if(t.includes('env'))document.getElementById('env').innerText=m;});</script></body></html>
