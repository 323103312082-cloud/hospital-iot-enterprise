<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hospital Live</title><script src="https://unpkg.com/mqtt@4.3.7/dist/mqtt.min.js"></script>
<style>body{font-family:Arial;background:#eef2ff;padding:15px}.card{background:#fff;padding:15px;border-radius:12px;margin:10px 0}#status{font-weight:bold}</style>
</head><body>
<h3>🏥 Hospital Live - EMQX</h3>
<div class="card">Status: <span id="status">Connecting to broker.emqx.io...</span><br><small id="info"></small></div>
<div class="card">HR: <b id="hr">--</b> | SpO2: <b id="spo2">--</b> | Body: <b id="bodyTemp">--</b></div>
<div class="card">Room: <b id="temp">--</b> | AQI: <b id="hum">--</b></div>
<script>
const url = "wss://broker.emqx.io:8084/mqtt";
document.getElementById("info").innerText = url;
const client = mqtt.connect(url,{clientId:"web_"+Math.random().toString(16).slice(2,8)});
client.on("connect",()=>{ document.getElementById("status").innerText="ONLINE 🟢 "+url; document.getElementById("status").style.color="green"; client.subscribe("hospital/#"); });
client.on("message",(t,m)=>{ try{ let d=JSON.parse(m.toString()); if(t.includes("vitals")){ document.getElementById("hr").innerText=d.hr; document.getElementById("spo2").innerText=d.spo2; document.getElementById("bodyTemp").innerText=d.bodyTemp; } if(t.includes("env")){ document.getElementById("temp").innerText=d.temp; document.getElementById("hum").innerText=d.hum; } }catch(e){} });
client.on("error",(e)=>{ document.getElementById("status").innerText="ERROR: "+e.message; });
</script></body></html>
